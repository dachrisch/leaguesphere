name: Deploy (Stage / Demo)

on:
  workflow_dispatch:
    inputs:
      environment:
        # Optional only so a candidate build can omit it; the `deploy` job
        # below rejects an empty value on the normal stage/demo path.
        description: "Target environment (required unless agent_candidate_ref is set)"
        required: false
        type: choice
        options:
          - staging
          - demo
      bump_type:
        description: "Semver bump (ignored when version is already an RC / demo)"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      agent_candidate_ref:
        description: "Build an agent image from this branch/tag/SHA (skips the version bump)"
        required: false
        default: ""
      agent_tag:
        description: "Image tag for the agent build (agent-candidate = cand, agent-ref = phase baseline)"
        required: false
        type: choice
        options:
          - agent-candidate
          - agent-ref
        default: agent-candidate

permissions:
  contents: write

jobs:
  deploy:
    if: inputs.agent_candidate_ref == ''
    runs-on: ubuntu-latest
    steps:
      - name: Require an environment for a stage/demo deploy
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$ENVIRONMENT" ]; then
            echo "::error::environment is required unless agent_candidate_ref is set."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Compute new version
        id: version
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          CURRENT=$(grep "__version__" league_manager/__init__.py | cut -d'"' -f2)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$ENVIRONMENT" = "staging" ]; then
            if [[ "$CURRENT" =~ -rc\.([0-9]+)$ ]]; then
              RC_NUM="${BASH_REMATCH[1]}"
              NEW_RC=$((RC_NUM + 1))
              NEW_VERSION="${CURRENT%-rc.*}-rc.${NEW_RC}"
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
              case "$BUMP_TYPE" in
                major) NEW_VERSION="$((MAJOR + 1)).0.0-rc.1" ;;
                minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0-rc.1" ;;
                patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-rc.1" ;;
              esac
            fi
          else
            if [[ "$CURRENT" =~ \+demo\.([0-9]+)$ ]]; then
              DEMO_NUM="${BASH_REMATCH[1]}"
              NEW_VERSION="${CURRENT%+demo.*}+demo.$((DEMO_NUM + 1))"
            else
              NEW_VERSION="${CURRENT}+demo.1"
            fi
          fi

          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $CURRENT → $NEW_VERSION"

      - name: Bump version files
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$NEW_VERSION\"/" league_manager/__init__.py
          for pkg in liveticker passcheck scorecard scorecard_v2 gameday_designer journey_dashboard share; do
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/" "$pkg/package.json"
          done
          sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml
          sed -i "s/current_version = \".*\"/current_version = \"$NEW_VERSION\"/" pyproject.toml

      - name: Regenerate uv.lock
        run: uv lock

      - name: Commit, tag, and push
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add league_manager/__init__.py \
            liveticker/package.json passcheck/package.json \
            scorecard/package.json scorecard_v2/package.json \
            gameday_designer/package.json \
            journey_dashboard/package.json \
            share/package.json \
            pyproject.toml uv.lock

          git commit -m "Bump version: $CURRENT_VERSION → $NEW_VERSION"
          git tag -a "v$NEW_VERSION" -m "Bump version: $CURRENT_VERSION → $NEW_VERSION"

          if ! git push origin "HEAD:$BRANCH" --follow-tags; then
            echo "::error::Push failed — nothing was deployed."
            exit 1
          fi

          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`$NEW_VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`$BRANCH\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`v$NEW_VERSION\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Create a PR to \`master\` to trigger the deployment." >> "$GITHUB_STEP_SUMMARY"

  # Phase 0c (dachrisch/leaguesphere#2536): build an image for the equivalence
  # harness. `agent-candidate` is the moving candidate (picked up by the
  # servyy-test timer); `agent-ref` is the phase baseline, rebuilt deliberately
  # from the stack base and never auto-updated.
  agent-image:
    if: inputs.agent_candidate_ref != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.agent_candidate_ref }}
          fetch-depth: 0

      - name: Resolve commit SHA
        id: ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push the agent image
        id: build_backend
        uses: docker/build-push-action@v7
        with:
          # Build the ref this job checked out. Without `context: .` the action
          # defaults to the workflow ref (the branch head), so a build of
          # `agent_candidate_ref=<base sha>` silently produced HEAD content -
          # the phase baseline then served the stack head's code.
          context: .
          file: container/app.Dockerfile
          push: true
          tags: docker.io/leaguesphere/backend:${{ inputs.agent_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.agent_tag }}
          build-args: |
            GIT_SHA=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Phase 3 Layer 1 (#2539): the agent stage used to run the backend image
      # only, so every `/static/…` request 404'd and no frontend journey could
      # be compared. Build the frontend image from the SAME resolved full SHA,
      # with the same context/cache/labels as the backend, in this same job.
      # Only the tag selected by `agent_tag` is built by a dispatch: the ref
      # baseline is built from the phase base SHA, each candidate from a layer
      # head. The two mutually exclusive steps below keep both tag derivations
      # explicit and atomic with the backend build.
      - name: Build and push the agent frontend image (ref baseline)
        id: build_frontend_ref
        if: inputs.agent_tag == 'agent-ref'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/nginx.Dockerfile
          push: true
          tags: docker.io/leaguesphere/frontend:agent-ref
          labels: |
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.agent_tag }}
          build-args: |
            GIT_SHA=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the agent frontend image (candidate)
        id: build_frontend_candidate
        if: inputs.agent_tag == 'agent-candidate'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/nginx.Dockerfile
          push: true
          tags: docker.io/leaguesphere/frontend:agent-candidate
          labels: |
            org.opencontainers.image.revision=${{ steps.ref.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.agent_tag }}
          build-args: |
            GIT_SHA=${{ steps.ref.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prove the agent frontend serves every built bundle
        run: |
          set -euo pipefail
          image="docker.io/leaguesphere/frontend:${{ inputs.agent_tag }}"
          name="ls-agent-static-proof-$$"
          docker run -d --rm --name "$name" -p 127.0.0.1::80 "$image" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$name" 80/tcp | head -n 1 | awk -F: '{print $NF}')"
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$port/static/league_manager/js/live_nav.js" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          # This is the exact probe that failed on the backend-only stage.
          body="$(curl -fsS "http://127.0.0.1:$port/static/league_manager/js/live_nav.js")"
          test -n "$body"
          for app in scorecard_v2 gameday_designer passcheck liveticker; do
            entry="$(docker exec "$name" find "/static/$app" -name '*.js' -size +0c -print -quit)"
            test -n "$entry"
          done
          echo "static proof passed for $image"

      - name: Summarise agent images
        run: |
          echo "### Agent images (Phase 3 Layer 1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| image | tag | full SHA | digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| backend | \`${{ inputs.agent_tag }}\` | \`${{ steps.ref.outputs.sha }}\` | \`${{ steps.build_backend.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| frontend | \`${{ inputs.agent_tag }}\` | \`${{ steps.ref.outputs.sha }}\` | \`${{ steps.build_frontend_ref.outputs.digest }}${{ steps.build_frontend_candidate.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
