# Developer Certificate of Origin (DCO) gate.
#
# Runs on GitHub Actions on purpose: the scoped CircleCI pipeline stays
# untouched (no new pipeline parameters or path rules), and a DCO check needs
# no build environment. Every human-authored commit in the pull request must
# carry a `Signed-off-by:` trailer — see CONTRIBUTING.md.
#
# Automation PRs (release-please, Renovate, Dependabot, GitHub Actions) are
# exempt: their commits are machine-generated and cannot sign the DCO. Without
# the exemption every release and dependency PR fails the gate.
name: 📝 DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Signed-off-by on every commit
    if: ${{ github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect PR commits
        id: get-pr-commits
        uses: tim-actions/get-pr-commits@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Signed-off-by trailers
        uses: tim-actions/dco@v1.1.0
        with:
          commits: ${{ steps.get-pr-commits.outputs.commits }}
