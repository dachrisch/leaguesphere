name: 🟢🏗️🧪📊 Build & run node tests (matrix)

on:
  workflow_call:
    inputs:
      projects:
        required: true
        description: JSON array of projects to test
        type: string

permissions:
  contents: write
  checks: write
  security-events: write

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - name: 🟢⚙️ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package.json

      - name: 🧪 Testing ${{ matrix.project }}
        run: |
          npm ci
          npm run test:coverage

      - name: 🔎 Typecheck ${{ matrix.project }}
        run: npm run typecheck --if-present

      - name: 📊 Upload Coverage to Codecov
        env:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}
        if: env.codecov_token != ''
        uses: codecov/codecov-action@v7
        with:
          directory: ${{ matrix.project }}/coverage
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.project }}

      - name: 🔍 Run eslint ${{ matrix.project }}
        run: npm run eslint:json
        continue-on-error: true

      - name: 👷 Building ${{ matrix.project }}
        run: npm run build > typescript.log

      - name: 🔍📝 Annotate ${{ matrix.project }} Linting Results
        uses: DerLev/eslint-annotations@v2
        with:
          eslint-report: ${{ matrix.project }}/js-lint-results-${{ matrix.project }}.json
          typescript-log: ${{ matrix.project }}/typescript.log

      - name: 🔍🔁 Convert ${{ matrix.project }} lint results to SARIF
        if: ${{ !cancelled() && hashFiles(format('{0}/js-lint-results-{0}.json', matrix.project)) != '' }}
        working-directory: .
        run: >
          node .github/scripts/eslint-json-to-sarif.mjs
          ${{ matrix.project }}/js-lint-results-${{ matrix.project }}.json
          ${{ matrix.project }}/js-lint-results-${{ matrix.project }}.sarif

      - name: 📦⬆️ Upload ${{ matrix.project }} lint results to Code Scanning
        if: ${{ !cancelled() && hashFiles(format('{0}/js-lint-results-{0}.sarif', matrix.project)) != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.project }}/js-lint-results-${{ matrix.project }}.sarif
          category: eslint-${{ matrix.project }}
