version: 2.1

# Setup config for scoped CI (dynamic config). This file ONLY decides
# WHAT runs: the path-filtering orb diffs the push against `master`,
# maps changed paths to pipeline parameters, and continues the
# pipeline with .circleci/continue.yml.
#
# Single source of truth for path → job mapping:
#   .circleci/scope-mapping.txt  (job triggers, 3-column rules)
#   .circleci/scope-exclude.txt  (explicit ignores: docs, dead code)
# scripts/check_scope_coverage.py enforces that every tracked file
# matches at least one rule in those files (always-on safety net).
#
# Tag pipelines: when the tag sits on master's tip there is no diff,
# so the orb falls back to HEAD~1 (same-base-run default). Release
# tags always touch version files across all apps → full run.
# A stale tag diffs huge → full run, then check_release_sequence
# refuses the deploy. Either way tags fail open to full, never to
# empty. Branch pushes with only ignored paths (docs) run just the
# always-on jobs (scope_coverage, check_version_sequence).
#
# NOTE: "Enable dynamic config using setup workflows" must be turned
# on in CircleCI project settings for this to take effect.
#
# NOTE: the job below needs its own `filters.tags` — CircleCI never
# runs a job against a tag-only ref unless the job opts in, regardless
# of what filters exist on the continued (child) config. Without this,
# every tag pipeline (releases included) is created but never runs
# anything: no setup job, no continuation, no deploy.

setup: true

orbs:
  path-filtering: circleci/path-filtering@2.1.0
  continuation: circleci/continuation@1.0.0

parameters:
  run-python-core:
    type: boolean
    default: false
  run-python-gamedays:
    type: boolean
    default: false
  run-python-officials:
    type: boolean
    default: false
  run-python-live:
    type: boolean
    default: false
  run-python-designer:
    type: boolean
    default: false
  run-python-cross:
    type: boolean
    default: false
  run-scorecard:
    type: boolean
    default: false
  run-liveticker:
    type: boolean
    default: false
  run-passcheck:
    type: boolean
    default: false
  run-designer:
    type: boolean
    default: false
  run-journey:
    type: boolean
    default: false
  run-e2e:
    type: boolean
    default: false
  run-build-backend:
    type: boolean
    default: false
  run-build-frontend:
    type: boolean
    default: false
  run-migrations:
    type: boolean
    default: false
  run-compose:
    type: boolean
    default: false

workflows:
  version: 2
  scope:
    jobs:
      - path-filtering/filter:
          base-revision: master
          config-path: .circleci/continue.yml
          mapping: .circleci/scope-mapping.txt
          exclude: .circleci/scope-exclude.txt
          filters:
            tags:
              only: /.*/
