            - setup_uv
            - python_shard_test:
                paths: "passcheck/tests/ gameday_designer/tests/ journey/tests.py journey/api/tests/ matchreport/tests/"
                junit: "test-results-designer.xml"
                cov_flag: "python-designer"

  python-cross:
    parameters:
