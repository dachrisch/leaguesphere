          needed: << parameters.needed >>
          steps:
            - checkout
            - node/install-packages:
                app-dir: passcheck/
            - run:
                name: "JavaScript Test Suite"
                command: npm --prefix passcheck/ run test:run
            - codecov/upload:
                dir: passcheck/coverage
                flags: passcheck
            - run:
                name: "TypeScript Typecheck"
                command: npm --prefix passcheck/ run typecheck
            - run:
                name: "JavaScript Linter"
                command: |
                  mkdir -p /tmp/eslint
                  npm --prefix passcheck/ run eslint:junit
            - store_test_results:
                path: /tmp/eslint
            - run:
                name: "JavaScript Build"
                command: npm --prefix passcheck/ run build

  gameday_designer_js:
    parameters:
      needed:
        type: boolean
        default: true
    executor:
      name: node/default
      tag: "24.17"
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: gameday_designer_js
          needed: << parameters.needed >>
          steps:
            - checkout
            - node/install-packages:
                app-dir: gameday_designer/
            - run:
                name: "JavaScript Test Suite"
                command: npm --prefix gameday_designer/ run test:run
            - codecov/upload:
                dir: gameday_designer/coverage
                flags: gameday_designer
            - run:
                name: "TypeScript Typecheck"
                command: npm --prefix gameday_designer/ run typecheck
            - run:
                name: "JavaScript Linter"
                command: npm --prefix gameday_designer/ run eslint
            - run:
                name: "JavaScript Build"
                command: npm --prefix gameday_designer/ run build

  journey_dashboard_js:
    parameters:
      needed:
        type: boolean
        default: true
    executor:
      name: node/default
      tag: "24.17"
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: journey_dashboard_js
          needed: << parameters.needed >>
          steps:
            - checkout
            - node/install-packages:
                app-dir: journey_dashboard/
            - run:
                name: "JavaScript Test Suite"
                command: npm --prefix journey_dashboard/ run test:run
            - codecov/upload:
