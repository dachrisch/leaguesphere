          job_name: python-cross
          needed: << parameters.needed >>
          steps:
            - checkout
            - setup_uv
            - python_shard_test:
                paths: "tests/ scripts/tests/"
                junit: "test-results-cross.xml"
                cov_flag: "python-cross"

  scorecard_js:
    parameters:
      needed:
        type: boolean
        default: true
    executor:
      name: node/default
      tag: "24.17"
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: scorecard_js
          needed: << parameters.needed >>
          steps:
            - checkout
            - node/install-packages:
                app-dir: scorecard/
            - run:
                name: "JavaScript Test Suite"
                command: npm --prefix scorecard/ run test:run
            - codecov/upload:
                dir: scorecard/coverage
                flags: scorecard
            - run:
                name: "JavaScript Linter"
                command: |
                  mkdir -p /tmp/eslint
                  npm --prefix scorecard/ run eslint:junit
            - store_test_results:
                path: /tmp/eslint
            - run:
                name: "JavaScript Build"
                command: npm --prefix scorecard/ run build

  scorecard_v2_js:
    parameters:
      needed:
        type: boolean
        default: true
    executor:
      name: node/default
      tag: "24.17"
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: scorecard_v2_js
          needed: << parameters.needed >>
          steps:
            - checkout
            - node/install-packages:
                app-dir: scorecard_v2/
            - run:
                name: "JavaScript Test Suite"
                command: npm --prefix scorecard_v2/ run test:run
            - codecov/upload:
                dir: scorecard_v2/coverage
                flags: scorecard-v2
            - run:
                name: "TypeScript Typecheck"
                command: npm --prefix scorecard_v2/ run typecheck
            - run:
                name: "JavaScript Linter"
                command: |
                  mkdir -p /tmp/eslint
                  npm --prefix scorecard_v2/ run eslint:junit
            - store_test_results:
                path: /tmp/eslint
            - run:
                name: "JavaScript Build"
                command: |
                  npm --prefix scorecard_v2/ run build
                  # The Django template loads a classic <script>; an `es` chunk would
                  # throw on import.meta and never mount.
                  if grep -q "import.meta" scorecard_v2/static/scorecard_v2/js/scorecard_v2.js; then
                    echo "IIFE bundle must not contain import.meta" >&2
                    exit 1
                  fi

  liveticker_js:
    parameters:
      needed:
        type: boolean
        default: true
    executor:
      name: node/default
      tag: "24.17"
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: liveticker_js
          needed: << parameters.needed >>
          steps:
            - checkout
            - node/install-packages:
                app-dir: liveticker/
            - run:
                name: "JavaScript Test Suite"
                command: npm --prefix liveticker/ run test:run
            - codecov/upload:
                dir: liveticker/coverage
                flags: liveticker
            - run:
                name: "JavaScript Linter"
                command: |
                  mkdir -p /tmp/eslint
                  npm --prefix liveticker/ run eslint:junit
            - store_test_results:
                path: /tmp/eslint
            - run:
                name: "JavaScript Build"
                command: npm --prefix liveticker/ run build

  passcheck_js:
