            - run:
                name: "JavaScript Linter"
                command: |
                  mkdir -p /tmp/eslint
                  npm --prefix journey_dashboard/ run eslint:junit
            - store_test_results:
                path: /tmp/eslint
            - run:
                name: "JavaScript Build"
                command: npm --prefix journey_dashboard/ run build

  share_js:
    parameters:
      needed:
        type: boolean
        default: true
    executor:
      name: node/default
      tag: "24.17"
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: share_js
          needed: << parameters.needed >>
          steps:
            - checkout
            - node/install-packages:
                app-dir: share/
            - run:
                name: "JavaScript Test Suite"
                command: npm --prefix share/ run test:run
            - run:
                name: "TypeScript Typecheck"
                command: npm --prefix share/ run typecheck
            - run:
                name: "JavaScript Linter"
                command: npm --prefix share/ run eslint
            - run:
                name: "JavaScript Build"
                command: npm --prefix share/ run build

  # Three browser suites, three jobs. They used to share one container and run
  # back to back (~4m25s of a ~6m PR run, 80% of the wall clock). Split, each
  # suite pays its own ~1m20s setup and the phase is as long as the slowest
  # suite (~2m45s). Nothing had to keep them together: each builds only the
  # app it drives (the designer suite drives the scorecard SPA for its login
  # and result flow, so it builds that one too).
  #
  # Every one of them is always-run (no `needed:`), so a docs-only push still
  # pays the checkout - that is the price of a required context that covers
  # every app. `full_gate` fans all three in.
  e2e_scorecard:
    docker:
      - image: cimg/python:3.15.2-node
      - image: cimg/mysql:26.10
        command: [ --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --default-storage-engine=InnoDB ]
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test_test_db
    working_directory: ~/repo
    steps:
      - checkout
      - setup_uv
      - node/install-packages:
          app-dir: scorecard/
      - run:
          name: Build scorecard
          command: npm --prefix scorecard/ run build
      - install_playwright
      - run:
          name: Run scorecard e2e tests
          # A hung browser click produces no output; 20 min of default patience
          # once turned a 4 min suite into a 20 min job (v4.42.1-rc.6).
          no_output_timeout: 8m
          environment:
            SECRET_KEY: 123456-TEST
            MYSQL_HOST: 127.0.0.1
            MYSQL_DB_NAME: test_test_db
            MYSQL_USER: root
            MYSQL_PWD: ""
          command: |
            uv run pytest scorecard/tests/e2e/ -v \
              --junitxml=test-reports/e2e-scorecard-results.xml
      - store_test_results:
          path: test-reports

  e2e_scorecard_v2:
    docker:
      - image: cimg/python:3.15.2-node
      - image: cimg/mysql:26.10
        command: [ --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --default-storage-engine=InnoDB ]
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test_test_db
    working_directory: ~/repo
    steps:
      - checkout
      - setup_uv
      - node/install-packages:
          app-dir: scorecard_v2/
      - run:
          name: Build scorecard_v2
          command: npm --prefix scorecard_v2/ run build
      - install_playwright
      - run:
          name: Run scorecard_v2 e2e tests
          no_output_timeout: 8m
          environment:
            SECRET_KEY: 123456-TEST
            MYSQL_HOST: 127.0.0.1
            MYSQL_DB_NAME: test_test_db
            MYSQL_USER: root
            MYSQL_PWD: ""
          command: |
            uv run pytest scorecard_v2/tests/e2e/ -v \
              --junitxml=test-reports/e2e-scorecard-v2-results.xml
      - store_test_results:
          path: test-reports

  e2e_designer:
    docker:
      - image: cimg/python:3.15.2-node
    working_directory: ~/repo
    steps:
      - checkout
      - setup_uv
      # test_designer_scorecard_flow.py logs in through /scorecard/ and reads
      # its result screen, so this job needs the scorecard bundle as well.
      - node/install-packages:
          app-dir: scorecard/
      - node/install-packages:
          app-dir: gameday_designer/
      - run:
          name: Build scorecard
          command: npm --prefix scorecard/ run build
      - run:
          name: Build gameday_designer
          command: npm --prefix gameday_designer/ run build
      - install_playwright
      - run:
          name: Run gameday_designer e2e tests
          no_output_timeout: 8m
          environment:
            SECRET_KEY: 123456-TEST
          command: |
            uv run pytest gameday_designer/tests/e2e/ -v \
              --ds=test_settings \
              --junitxml=test-reports/e2e-designer-results.xml
      - store_test_results:
          path: test-reports

  build_backend:
    # Always scheduled so the required checks that depend on it always have a
    # predecessor; the build itself only runs when the scope asks for an image.
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: build_backend
          needed: << parameters.needed >>
          steps:
            - checkout
            - ensure_lockfile
            - setup_remote_docker:
                version: 20.10.24
                docker_layer_caching: true
            - build_docker_image:
                dockerfile: container/app.Dockerfile
                image_name: backend

  build_frontend:
    # Always scheduled so the required checks that depend on it always have a
    # predecessor; the build itself only runs when the scope asks for an image.
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: build_frontend
          needed: << parameters.needed >>
          steps:
            - checkout
            - ensure_lockfile
            - setup_remote_docker:
                version: 20.10.24
                docker_layer_caching: true
            - build_docker_image:
                dockerfile: container/nginx.Dockerfile
                image_name: frontend

  test_backend_image:
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      - image: cimg/base:stable
    steps:
      - scoped_job:
          job_name: test_backend_image
          needed: << parameters.needed >>
          steps:
            - setup_remote_docker:
                version: 20.10.24
            - attach_workspace:
                at: /tmp
            - run:
                name: Test Backend Image Health
                command: |
                  docker load -i /tmp/docker-images/backend.tar
                  docker network create test_network
                  docker run --network test_network -d --name app mockserver/mockserver -serverPort 8000

                  # Set expectations via container on same network
                  docker run --rm --network test_network curlimages/curl -s --retry 10 --retry-connrefused http://app:8000/mockserver/status
                  docker run --rm --network test_network curlimages/curl -s -X PUT \
                    --data '{"httpRequest": {"method": "GET", "path": "/"}, "httpResponse": {"statusCode": 200}}' \
                    http://app:8000/mockserver/expectation
                  docker run --rm --network test_network curlimages/curl -s -X PUT \
                    --data '{"httpRequest": {"method": "GET", "path": "/login/"}, "httpResponse": {"statusCode": 200, "headers": {"Set-Cookie": ["csrftoken=mocktoken123"]}}}' \
                    http://app:8000/mockserver/expectation
                  docker run --rm --network test_network curlimages/curl -s -X PUT \
                    --data '{"httpRequest": {"method": "POST", "path": "/login/"}, "httpResponse": {"statusCode": 200}}' \
                    http://app:8000/mockserver/expectation

                  # Test health status (envs are CI-only dummies: the prod settings
                  # guard requires all of them set, and fork PRs get no contexts;
                  # all HTTP is answered by mockserver, no real DB is ever touched)
                  docker run --rm --detach --network test_network --name test_container \
                    -e SECRET_KEY=test-image-dummy-secret-not-for-production \
                    -e MYSQL_HOST=127.0.0.1 \
                    -e MYSQL_DB_NAME=ci_dummy \
                    -e MYSQL_USER=ci_dummy \
                    -e MYSQL_PWD=ci_dummy \
                    backend:latest gunicorn -b 0.0.0.0:8000 league_manager.wsgi
                  sleep 3
                  for i in {1..10}; do
                    status=$(docker inspect --format='{{.State.Health.Status}}' test_container)
                    echo "Health status: $status"
                    if [ "$status" = "healthy" ]; then break; fi
                    sleep 6
                  done
                  if [ "$status" != "healthy" ]; then
                    echo "Container did not become healthy"
                    exit 1
                  fi

  test_frontend_image:
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      - image: cimg/base:stable
    steps:
      - scoped_job:
          job_name: test_frontend_image
          needed: << parameters.needed >>
          steps:
            - setup_remote_docker:
                version: 20.10.24
            - attach_workspace:
                at: /tmp
            - run:
                name: Test Frontend Image Health
                command: |
                  docker load -i /tmp/docker-images/frontend.tar
                  docker network create test_network
                  # Frontend healthcheck DOES need a backend (or mock) at http://app:8000
                  docker run --network test_network -d --name app mockserver/mockserver -serverPort 8000

                  # Wait for mockserver and set expectations via container on same network
                  docker run --rm --network test_network curlimages/curl -s --retry 10 --retry-connrefused http://app:8000/mockserver/status
                  docker run --rm --network test_network curlimages/curl -s -X PUT \
                    --data '{"httpRequest": {"method": "GET", "path": "/login/"}, "httpResponse": {"statusCode": 200, "headers": {"Set-Cookie": ["csrftoken=mocktoken123"]}}}' \
                    http://app:8000/mockserver/expectation
                  docker run --rm --network test_network curlimages/curl -s -X PUT \
                    --data '{"httpRequest": {"method": "POST", "path": "/login/"}, "httpResponse": {"statusCode": 200}}' \
                    http://app:8000/mockserver/expectation

                  docker run --rm --detach --network test_network --name test_container frontend:latest
                  sleep 3
                  for i in {1..10}; do
                    status=$(docker inspect --format='{{.State.Health.Status}}' test_container)
                    echo "Health status: $status"
                    if [ "$status" = "healthy" ]; then break; fi
                    sleep 6
                  done
                  if [ "$status" != "healthy" ]; then
                    echo "Container did not become healthy"
                    docker logs test_container
                    exit 1
                  fi

                  # The image must actually serve the v2 bundle (Task 22 DoD: builds and serves).
                  docker run --rm --network test_network curlimages/curl -fsS \
                    http://test_container/static/scorecard_v2/js/scorecard_v2.js > /dev/null
                  echo "scorecard_v2 bundle is served by the frontend image"

  # Required status check, so it is never path-scoped: a docs-only PR must
  # still report it, otherwise the required check sits in "Expected" and the
  # PR cannot merge. It therefore runs the repo itself on an ephemeral
  # MariaDB instead of the built backend image — the image side is covered by
  # test_backend_image, which stays scoped.
  check_migrations:
    docker:
      - image: cimg/python:3.15.2
      - image: cimg/mysql:26.10
        command: [ --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --default-storage-engine=InnoDB ]
        environment:
          # A dummy root password, not an empty one: the production settings
          # guard refuses to load without MYSQL_PWD, and this job deliberately
          # runs with the production settings (not test_settings).
          MYSQL_ROOT_PASSWORD: ci-check-pw
          MYSQL_DATABASE: test_test_db
    working_directory: ~/repo
    steps:
      - checkout
      - setup_uv
      - run:
          name: Check Django migrations against an ephemeral internal DB
          environment:
            SECRET_KEY: 123456-TEST
            MYSQL_HOST: 127.0.0.1
            MYSQL_DB_NAME: test_test_db
            MYSQL_USER: root
            MYSQL_PWD: ci-check-pw
          command: |
            # The MySQL service container starts beside the steps, not before
            # them: wait for its port before Django opens a connection.
            for i in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1; then break; fi
              echo "waiting for mysql ($i)..."; sleep 2
            done
            # No missing migrations, and the full set applies cleanly end-to-end
            # on an empty database. The test shards run with --nomigrations, so
            # this job is the one place migrations are exercised.
            uv run python manage.py check
            uv run python manage.py makemigrations --check --dry-run
            uv run python manage.py migrate --no-input

  test_compose_network:
    # Required status check, so it is scheduled on every push; it boots the
    # stack only when the scope built images (`needed`), and otherwise reports
    # green without building what nothing needs.
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      - image: cimg/base:stable
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: test_compose_network
          needed: << parameters.needed >>
          steps:
            - checkout
            - setup_remote_docker:
                version: 20.10.24
            - attach_workspace:
                at: /tmp
            - run:
                name: Test Docker Compose Network
                command: |
                  export DOCKER_BUILDKIT=1
                  export COMPOSE_DOCKER_CLI_BUILD=1
                  docker load -i /tmp/docker-images/backend.tar
                  docker load -i /tmp/docker-images/frontend.tar
                  cd deployed
                  cat > .env \<<EOF
                  SERVICE_NAME=leaguesphere
                  COMPOSE_PROJECT_NAME=leaguesphere
                  SERVICE_HOST=localhost
                  LOCAL_HOSTNAME=localhost
                  RUN_MIGRATIONS=false
                  EOF
                  cat > ls.env.ci \<<EOF
                  SECRET_KEY=ci-test-secret-key-not-for-production
                  MYSQL_HOST=db
                  # base.py (and the app) read these names...
                  MYSQL_DB_NAME=ci_test_db
                  MYSQL_USER=ci_test_user
                  MYSQL_PWD=ci_test_password
                  MYSQL_ROOT_PASSWORD=ci_test_root_pw
                  # ...while the mariadb image's own entrypoint creates the DB/user
                  # from the standard MYSQL_DATABASE/MYSQL_PASSWORD names.
                  MYSQL_DATABASE=ci_test_db
                  MYSQL_PASSWORD=ci_test_password
                  DEBUG=False
                  EOF
                  cat > dba.env \<<EOF
                  DBACCESS_HOST=db
                  DBACCESS_PORT=3306
                  DBACCESS_USER=ci_provisioner
                  DBACCESS_PASSWORD=ci_test_password
                  DBACCESS_DB=ci_test_db
                  DBACCESS_HOST_PATTERN=172.25.%
                  EOF
                  sed -e 's/env_file: ls.env/env_file: ls.env.ci/g' \
                      -e 's|image: leaguesphere/backend:latest|image: backend:latest|g' \
                      -e 's|image: leaguesphere/frontend:latest|image: frontend:latest|g' \
                      docker-compose.yaml > docker-compose.ci.yaml
                  docker network create proxy || true
                  # CircleCI injects project-level MYSQL_* (the test-shard DB creds)
                  # into this job's shell, and this Compose lets the shell env override
                  # env_file — so the app and db would end up disagreeing on the
                  # user/password. Drop them so ls.env.ci wins for this throwaway stack.
                  unset MYSQL_HOST MYSQL_DB_NAME MYSQL_USER MYSQL_PWD MYSQL_ROOT_PASSWORD MYSQL_DATABASE MYSQL_PASSWORD
                  docker-compose -f docker-compose.ci.yaml up -d
                  docker-compose -f docker-compose.ci.yaml ps

                  APP_CONTAINER=$(docker-compose -f docker-compose.ci.yaml ps -q app)
                  # The CI compose DB ships no schema, but the frontend healthcheck
                  # performs a real login POST, which needs auth_user. Migrate before
                  # asserting health; retry until the db service accepts connections.
                  migrated=false
                  for i in $(seq 1 30); do
                    docker exec "$APP_CONTAINER" python manage.py migrate --no-input && migrated=true && break
                    echo "waiting for db/app ($i)..."; sleep 3
                  done
                  if [ "$migrated" != "true" ]; then
                    echo "Migrations never succeeded; db + app logs follow"
                    docker logs "$(docker-compose -f docker-compose.ci.yaml ps -q db)" || true
                    docker logs "$APP_CONTAINER" || true
                    docker-compose -f docker-compose.ci.yaml down -v
                    exit 1
                  fi

                  # End-to-end guard the mockserver-based test_frontend_image cannot
                  # give: real prod settings (SECURE_SSL_REDIRECT) + real nginx + real
                  # healthcheck. This is what the 4.32.0 deploy broke.
                  WWW_CONTAINER=$(docker-compose -f docker-compose.ci.yaml ps -q www)
                  status=""
                  if [ -n "$WWW_CONTAINER" ]; then
                    for i in $(seq 1 24); do
                      status=$(docker inspect --format='{{.State.Health.Status}}' "$WWW_CONTAINER")
                      echo "www health: $status"
                      [ "$status" = "healthy" ] && break
                      sleep 5
                    done
                  fi
                  if [ "$status" != "healthy" ]; then
                    echo "Frontend container did not become healthy"
                    docker exec "$WWW_CONTAINER" sh -c 'curl -s -o /dev/null -w "probe-no-header=%{http_code}\n" http://localhost/login/; curl -s -o /dev/null -w "probe-with-header=%{http_code}\n" -H "X-Forwarded-Proto: https" http://localhost/login/' || true
                    docker logs "$WWW_CONTAINER" || true
                    docker-compose -f docker-compose.ci.yaml down -v
                    exit 1
                  fi

                  docker exec "$APP_CONTAINER" sh -c 'curl -f --max-time 10 https://www.google.com'
                  docker-compose -f docker-compose.ci.yaml down -v

  check_release_sequence:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Refuse to deploy a tag older than the currently released version
          command: |
            TAG="${CIRCLE_TAG}"
            VERSION="${TAG#v}"
            VERSION="${VERSION%%-rc.*}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            # .release-please-manifest.json on master is the single source of
            # truth for "what's the latest intended release" - fetch it fresh
            # (not from this job's own checkout) so a delayed/redelivered
            # webhook for an old tag can't race a newer one that already shipped.
            LATEST=$(curl -sf "https://raw.githubusercontent.com/${REPO}/master/.release-please-manifest.json" | grep -o '"[0-9]\+\.[0-9]\+\.[0-9]\+"' | tr -d '"')

            if [ -z "$LATEST" ]; then
              echo "Could not read the current version from master's release-please manifest - failing closed"
              exit 1
            fi

            echo "This build's tag: ${VERSION} (from ${TAG})"
            echo "Currently released version (master manifest): ${LATEST}"

            OLDEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | head -1)
            if [ "$OLDEST" = "$VERSION" ] && [ "$VERSION" != "$LATEST" ]; then
              echo "${TAG} (${VERSION}) is older than the currently released version (${LATEST})."
              echo "This looks like a stale/out-of-order CI trigger (e.g. a delayed GitHub webhook redelivery for an old tag) - refusing to deploy so production isn't rolled backwards."
              exit 1
            fi

            echo "${TAG} is current. Proceeding."

  # Fan-in for deploys: every scoped job of a full run.
  full_gate:
    # Terminal context of the matrix: every job it fans in is always
    # scheduled (scoped jobs no-op via `needed`), so this job runs on
    # branch pipelines too and the ruleset can require it. Green here means
    # every suite this diff scoped in passed; deploys require it as well.
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Full-run gate
          command: echo "Every scoped job of this run finished green."

  scope_coverage:
    docker:
      - image: cimg/python:3.15.2
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Every tracked path must have a scope rule
          command: |
            # Always-on safety net for scoped CI (never path-scoped
            # itself): fails the pipeline when a tracked file matches
            # neither .circleci/scope-mapping.txt nor
            # .circleci/scope-exclude.txt. stdlib only, no dependencies.
            python3 scripts/check_scope_coverage.py
      - run:
          name: Every CI Codecov flag must carry forward
          command: |
            # Also always-on: a .codecov.yml-only change is scope-excluded
            # and runs no shard, so the python-cross unit test wouldn't
            # catch a config regression. Fails when a flag CI uploads is
            # not carryforward-enabled (issue #2015). stdlib only.
            python3 scripts/check_codecov_flags.py
      - run:
          name: Every scoped job must report a status and feed the gate
          command: |
            # Also always-on: no job may be switched off with a `filters:`
            # expression (a job that never runs publishes no status, so a
            # required check can never see it), every `needed:` entry must
            # point at a declared parameter, and full_gate must fan in every
            # job that runs on tags. stdlib only.
            python3 scripts/check_ci_gate.py

  code_graph:
    # The knowledge graph the repo's local graphify hook keeps in graphify-out/,
    # rebuilt for each pipeline that touches one of the graphified modules and
    # published as job artifacts (graph.json, graph.html, GRAPH_REPORT.md).
    # Code-only AST: no API key, no LLM, nothing to leak. Informational, but it
    # runs on tags like every other job so a release cannot skip it.
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      # graphifyy pins requires-python <3.15, so this job cannot use the
      # 3.15.2 image the test jobs run on.
      - image: cimg/python:3.14
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: code_graph
          needed: << parameters.needed >>
          steps:
            - checkout
            - run:
                name: Install graphify
                command: |
                  python -m pip install --quiet --disable-pip-version-check \
                    graphifyy==0.9.106
            - run:
                name: Build the code graph
                environment:
                  # Deterministic clustering: louvain iterates string-keyed
                  # sets whose order PYTHONHASHSEED randomizes per process.
                  PYTHONHASHSEED: "0"
                command: |
                  graphify extract . --code-only
                  graphify cluster-only . --no-label
            - store_artifacts:
                path: graphify-out/graph.json
            - store_artifacts:
                path: graphify-out/graph.html
            - store_artifacts:
                path: graphify-out/GRAPH_REPORT.md

  check_version_sequence:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Refuse backwards or desynced version bumps (PR time)
          command: |
            # Branch-side counterpart to check_release_sequence (which only
            # runs on tag pipelines): blocks merges that would move
            # .release-please-manifest.json backwards (e.g. #1925's
            # 4.23.0 -> 4.15.3), desync version files from the manifest,
            # or leak staging -rc/+demo versions or manifest/CHANGELOG
            # edits from feature branches into master.
            python3 scripts/check_version_sequence.py

  deploy_staging:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Plan staging deploy
          command: |
            circleci run release plan "leaguesphere-stage" \
              --environment-name="stage" \
              --component-name="leaguesphere" \
              --target-version="${CIRCLE_TAG}"
      - push_docker_image:
          image_name: backend
          registry_image_name: leaguesphere/backend
          tag: staging
          extra_tag: $CIRCLE_TAG
      - push_docker_image:
          image_name: frontend
          registry_image_name: leaguesphere/frontend
          tag: staging
          extra_tag: $CIRCLE_TAG
      - run:
          name: Update staging deploy to SUCCESS
          command: circleci run release update "leaguesphere-stage" --status=SUCCESS
          when: on_success
      - run:
          name: Update planned staging deploy to FAILED
          command: circleci run release update "leaguesphere-stage" --status=FAILED
          when: on_fail

  deploy_demo:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Set sanitized Docker tag
          command: |
            echo "export DOCKER_TAG=$(echo "$CIRCLE_TAG" | sed 's/+/-/g')" >> $BASH_ENV
      - run:
          name: Plan demo deploy
          command: |
            circleci run release plan "leaguesphere-demo" \
              --environment-name="demo" \
              --component-name="leaguesphere" \
              --target-version="${CIRCLE_TAG}"
      - push_docker_image:
          image_name: backend
          registry_image_name: leaguesphere/backend
          tag: demo
          extra_tag: $DOCKER_TAG
      - push_docker_image:
          image_name: frontend
          registry_image_name: leaguesphere/frontend
          tag: demo
          extra_tag: $DOCKER_TAG
      - run:
          name: Update demo deploy to SUCCESS
          command: circleci run release update "leaguesphere-demo" --status=SUCCESS
          when: on_success
      - run:
          name: Update planned demo deploy to FAILED
          command: circleci run release update "leaguesphere-demo" --status=FAILED
          when: on_fail

  deploy_production:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.24
      - run:
          name: Plan production deploy
          command: |
            circleci run release plan "leaguesphere-prod" \
              --environment-name="prod" \
              --component-name="leaguesphere" \
              --target-version="${CIRCLE_TAG}"
      - push_docker_image:
          image_name: backend
          registry_image_name: leaguesphere/backend
          tag: latest
          extra_tag: $CIRCLE_TAG
      - push_docker_image:
          image_name: frontend
          registry_image_name: leaguesphere/frontend
          tag: latest
          extra_tag: $CIRCLE_TAG
      - run:
          name: Update production deploy to SUCCESS
          command: circleci run release update "leaguesphere-prod" --status=SUCCESS 
          when: on_success 
      - run:
          name: Update planned production deploy to FAILED
          command: circleci run release update "leaguesphere-prod" --status=FAILED 
          when: on_fail

  ensure_draft_release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - github-cli/install
      - run:
          name: Ensure Draft GitHub Release (idempotent)
          command: |
            TAG="${CIRCLE_TAG}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            # release-please already creates a draft release for tags it produces.
            # Skip creation when one exists so this step never fails on that path.
            if gh release view "${TAG}" --repo "${REPO}" &> /dev/null; then
              echo "Release ${TAG} already exists (release-please or a previous run) - skipping"
              exit 0
            fi

            echo "Creating draft release ${TAG}"
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --draft --title "${TAG}" --generate-notes
          env:
            GH_TOKEN: ${GITHUB_TOKEN}

  promote_to_prerelease:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - github-cli/install
      - run:
          name: Promote Release to Prerelease
          command: |
            TAG="${CIRCLE_TAG}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            echo "Promoting ${TAG} to prerelease after staging succeeds"
            gh release edit "${TAG}" \
              --repo "${REPO}" \
              --draft=false \
              --prerelease
          env:
            GH_TOKEN: ${GITHUB_TOKEN}

  create_production_release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - github-cli/install
      - run:
          name: Publish Production Release
          command: |
            TAG="${CIRCLE_TAG}"
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"

            echo "Publishing production release for tag: ${TAG}"
            gh release edit "${TAG}" \
              --repo "${REPO}" \
              --draft=false \
              --prerelease=false \
              --latest
          env:
            GH_TOKEN: ${GITHUB_TOKEN}

  auto_approve_hold_production:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Auto-approve hold_production when no active games
          command: |
            sudo apt-get update -qq && sudo apt-get install -qq -y jq

            # Fetch game progress data (unrestricted public API)
            response=$(curl -sf "https://www.leaguesphere.app/api/game-progress/?page_size=100")
            if [ -z "$response" ]; then
              echo "Failed to fetch game progress API - leaving hold_production for manual approval"
              exit 0
            fi

            # Check for active games (status indicates in-progress on today's gamedays).
            # Past gamedays with stale statuses (e.g. a game stuck in "2. Halbzeit")
            # should not block deploys. "Geplant" games checked separately below.
            today_date=$(TZ=Europe/Berlin date +%Y-%m-%d)
            active_count=$(echo "$response" | jq \
              --arg today "$today_date" \
              '[.results[] | select(.date == $today) | .games[] | select(.status != "beendet" and .status != "Geplant")] | length')
            if [ "$active_count" -gt 0 ]; then
              echo "Active games detected ($active_count) - leaving hold_production for manual approval"
              exit 0
            fi

            # Check for upcoming games within the next 4 hours (game times are CET/CEST)
            now_epoch=$(TZ=Europe/Berlin date +%s)
            window_epoch=$(TZ=Europe/Berlin date -d '+4 hours' +%s)

            upcoming_count=0
            while IFS= read -r dt; do
              game_epoch=$(TZ=Europe/Berlin date -d "$dt" +%s 2>/dev/null) || continue
              if [ "$game_epoch" -ge "$now_epoch" ] && [ "$game_epoch" -le "$window_epoch" ]; then
                upcoming_count=$((upcoming_count + 1))
              fi
            done < <(echo "$response" | jq -r \
              '.results[] | .date as $d | .games[] | select(.scheduled != null) | $d + " " + .scheduled')

            if [ "$upcoming_count" -gt 0 ]; then
              echo "Games scheduled within next 4 hours ($upcoming_count) - leaving hold_production for manual approval"
              exit 0
            fi

            echo "No active or upcoming games - auto-approving hold_production"

            approval_request_id=""
            for i in $(seq 1 30); do
              approval_request_id=$(curl -sf --header "Circle-Token: ${CIRCLE_API_APPROVE_TOKEN}" \
                "https://circleci.com/api/v2/workflow/${CIRCLE_WORKFLOW_ID}/job" \
                | jq -r '.items[] | select(.name == "hold_production") | .approval_request_id // empty')
              if [ -n "$approval_request_id" ]; then
                break
              fi
              echo "Waiting for hold_production approval request to appear ($i/30)..."
              sleep 5
            done

            if [ -z "$approval_request_id" ]; then
              echo "Could not find hold_production's approval_request_id in workflow ${CIRCLE_WORKFLOW_ID}"
              exit 1
            fi

            echo "Approving hold_production (approval_request_id=${approval_request_id})"
            curl -sf --request POST \
              --header "Circle-Token: ${CIRCLE_API_APPROVE_TOKEN}" \
              "https://circleci.com/api/v2/workflow/${CIRCLE_WORKFLOW_ID}/approve/${approval_request_id}"

workflows:
  version: 2
  build_test_deploy:
    # Skip the master-push run: merges are PR-only (ruleset requires a PR)
    # and required status checks must be up to date with master before
    # merging, so whatever lands on master was just CI'd against that exact
    # base a moment earlier - a second full run on the merge commit itself
    # adds nothing. Still runs on every other branch (including the
    # release-please branch, so its required checks post normally) and on
    # tags (via each job's own `tags` filter, for deploys).
    when:
      not:
        equal: [ << pipeline.git.branch >>, "master" ]
    jobs:
      # Scoped test jobs: no `requires` (they fan out in parallel) and a
      # `needed` parameter each, driven by the pipeline parameters the scope
      # job sets in config.yml. They are always *scheduled* and decide
      # inside whether to do the work, so every scoped suite still publishes
      # a status context and `full_gate` can be required on branches.
      #
      # The image chain follows the same rule. build_backend,
      # build_frontend, test_backend_image, test_frontend_image and the
      # required test_compose_network are always scheduled and decide inside
      # (`needed`, from the single `run-images` parameter) whether to build or
      # boot. That is what keeps every required context reporting on every
      # push without building an image for a docs-only diff — a filtered-out
      # job publishes no context at all, which stranded PRs in "Expected"
      # (see docs/topics/deployment/scoped-ci.md).
      #
      # The three e2e jobs are always-run: a required check that touches every
      # app by convention. They are split per app so the browser suites run in
      # parallel instead of back to back. They do not gate the image smoke
      # tests - e2e reaches the deploy through `full_gate` like everything
      # else, so a slow browser suite never delays a docker check.
      #
      # Tests gate *deploys*, not builds: `full_gate` fans in every job above
      # and the deploy jobs require it, so a release only ships when the
      # complete matrix of a full run is green. Because every scoped job is
      # always *scheduled*, `full_gate` also runs on a branch — where it is
      # the required context that closes the scope: green means every suite
      # this diff scoped in is green, and a red scoped suite blocks the merge
      # instead of surfacing on the next release PR (#2353 → #2356).
      - python-core:
          needed: << pipeline.parameters.run-python-core >>
          filters:
            tags:
              only: /.*/
      - python-gamedays:
          needed: << pipeline.parameters.run-python-gamedays >>
          filters:
            tags:
              only: /.*/
      - python-officials:
          needed: << pipeline.parameters.run-python-officials >>
          filters:
            tags:
              only: /.*/
      - python-live:
          needed: << pipeline.parameters.run-python-live >>
          filters:
            tags:
              only: /.*/
      - python-designer:
          needed: << pipeline.parameters.run-python-designer >>
          filters:
            tags:
              only: /.*/
      - python-cross:
          needed: << pipeline.parameters.run-python-cross >>
          filters:
            tags:
              only: /.*/
      # Always-run: required check, exercises every app by convention. Opts
      # in to tags (tags: only /.*/) because a job with no filters only runs
      # on branches — without this, the browser suites silently drop out of
      # tag pipelines (deploys) and their requires entries vanish, so deploys
      # bypass them. One job per app so they run in parallel.
      - e2e_scorecard:
          filters:
            tags:
              only: /.*/
      - e2e_scorecard_v2:
          filters:
            tags:
              only: /.*/
      - e2e_designer:
          filters:
            tags:
              only: /.*/
      - scorecard_js:
          needed: << pipeline.parameters.run-scorecard >>
          filters:
            tags:
              only: /.*/
      - scorecard_v2_js:
          needed: << pipeline.parameters.run-scorecard-v2 >>
          filters:
            tags:
              only: /.*/
      - liveticker_js:
          needed: << pipeline.parameters.run-liveticker >>
          filters:
            tags:
              only: /.*/
      - passcheck_js:
          needed: << pipeline.parameters.run-passcheck >>
          filters:
            tags:
              only: /.*/
      - gameday_designer_js:
          needed: << pipeline.parameters.run-designer >>
          filters:
            tags:
              only: /.*/
      - journey_dashboard_js:
          needed: << pipeline.parameters.run-journey >>
          filters:
            tags:
              only: /.*/
      - share_js:
          needed: << pipeline.parameters.run-share >>
          filters:
            tags:
              only: /.*/

      # Rebuilds the code graph (graphify, code-only AST over gamedays,
      # gameday_designer and scorecard_v2) and publishes it as artifacts.
      - code_graph:
          needed: << pipeline.parameters.run-code-graph >>
          filters:
            tags:
              only: /.*/

      # The image chain is always scheduled (required checks depend on it) and
      # builds only when the scope asks for an image: no image is built for a
      # diff that needs none. Tests no longer gate the builds — they gate the
      # deploy through `full_gate` below.
      - build_backend:
          needed: << pipeline.parameters.run-images >>
          filters:
            tags:
              only: /.*/
      - build_frontend:
          needed: << pipeline.parameters.run-images >>
          filters:
            tags:
              only: /.*/

      # The image smoke tests only need their own image. They used to wait for
      # the browser suite as well, which serialised a 35 s check behind the
      # slowest job of the run for no gain - e2e still gates the deploy
      # through `full_gate`.
      - test_backend_image:
          needed: << pipeline.parameters.run-images >>
          filters:
            tags:
              only: /.*/
          requires:
            - build_backend
      - test_frontend_image:
          needed: << pipeline.parameters.run-images >>
          filters:
            tags:
              only: /.*/
          requires:
            - build_frontend
      - check_migrations:
          # Required status check: never path-scoped, so it reports on every
          # branch and tag pipeline (see the job's own comment).
          filters:
            tags:
              only: /.*/
      - test_compose_network:
          needed: << pipeline.parameters.run-images >>
          filters:
            tags:
              only: /.*/
          requires:
            - build_backend
            - build_frontend
            - check_migrations

      # rc tags are image tags only. Publishing an rc as a GitHub pre-release
      # makes release-please see a release for a version whose stable tag does
      # not exist yet; it then walks the whole history and opens a bogus major
      # release (the 6.0.0 incident). Stable tags keep the draft/promote/publish
      # chain below.
      - ensure_draft_release:
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/

      - check_release_sequence:
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/
            branches:
              ignore: /.*/

      # Branch-only guard (no tags filter on purpose: tag pipelines are
      # covered by check_release_sequence, and comparing a tag checkout
      # against origin/master would misfire on legitimately old tags).
      - check_version_sequence

      # Scope safety net (never path-scoped itself).
      - scope_coverage

      # Every scoped job of a full run, as one fan-in the deploys can require
      # without re-listing the matrix themselves.
      - full_gate:
          filters:
            tags:
              only: /.*/
          requires:
            - python-core
            - python-gamedays
            - python-officials
            - python-live
            - python-designer
            - python-cross
            - scorecard_js
            - scorecard_v2_js
            - liveticker_js
            - passcheck_js
            - gameday_designer_js
            - journey_dashboard_js
            - share_js
            - code_graph
            - e2e_scorecard
            - e2e_scorecard_v2
            - e2e_designer
            - check_migrations
            - build_backend
            - build_frontend
            - test_backend_image
            - test_frontend_image
            - test_compose_network

      # Deploy jobs run on tag pipelines only, where the scope resolves to a
      # full run, so `full_gate` has every job it fans in.
      - deploy_staging:
          context: staging
          requires:
            - full_gate
            - check_release_sequence
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/
            branches:
              ignore: /.*/

      - promote_to_prerelease:
          requires:
            - deploy_staging
            - ensure_draft_release
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/

      - deploy_demo:
          context: demo
          requires:
            - full_gate
          filters:
            tags:
              only: /.*\+demo\.[0-9]+$/
            branches:
              ignore: /.*/

      - hold_production:
          type: approval
          requires:
            - full_gate
            - check_release_sequence
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      # Auto-approves hold_production via the CircleCI API when no active or
      # upcoming games are detected, so production deploys are blocked during
      # live game windows and auto-approved otherwise.
      - auto_approve_hold_production:
          context: production
          requires:
            - full_gate
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/

      - deploy_production:
          context: production
          requires:
            - ensure_draft_release
            - hold_production
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - deploy_demo:
          name: deploy_demo_production
          context: demo
          requires:
            - hold_production
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - create_production_release:
          requires:
            - deploy_production
            - promote_to_prerelease
          filters:
            tags:
              only: /^v?[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
