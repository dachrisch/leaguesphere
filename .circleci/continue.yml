          MYSQL_DATABASE: test_test_db
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: python-gamedays
          needed: << parameters.needed >>
          steps:
            - checkout
            - setup_uv
            - python_shard_test:
                paths: "gamedays/ league_table/ gameevents/"
                junit: "test-results-gamedays.xml"
                cov_flag: "python-gamedays"

  python-officials:
