version: 2.1

orbs:
  node: circleci/node@7.2.1
  github-cli: circleci/github-cli@3.0.1
  codecov: codecov/codecov@6.1.0

# Scoped-CI pipeline parameters, set by the path-filtering `scope` job
# in config.yml (setup workflow) from .circleci/scope-mapping.txt.
# Defaults are false: docs-only pushes run just the always-on jobs
# (scope_coverage, check_version_sequence). Tag pipelines resolve to
# full runs via version-file changes (see config.yml header).
parameters:
  run-python-core:
    type: boolean
    default: false
  run-python-gamedays:
    type: boolean
    default: false
  run-python-officials:
    type: boolean
    default: false
  run-python-live:
    type: boolean
    default: false
  run-python-designer:
    type: boolean
    default: false
  run-python-cross:
    type: boolean
    default: false
  run-scorecard:
    type: boolean
    default: false
  run-scorecard-v2:
    type: boolean
    default: false
  run-liveticker:
    type: boolean
    default: false
  run-passcheck:
    type: boolean
    default: false
  run-designer:
    type: boolean
    default: false
  run-journey:
    type: boolean
    default: false
  run-share:
    type: boolean
    default: false
  run-images:
    type: boolean
    default: false
  run-code-graph:
    type: boolean
    default: false

commands:
  setup_uv:
    steps:
      - run:
          name: install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "pyproject.toml" }}
            - v2-dependencies-
      - run:
          name: install dependencies
          command: |
            uv sync --extra test
      - save_cache:
          paths:
            - .venv
          key: v2-dependencies-{{ checksum "pyproject.toml" }}

  ensure_lockfile:
    steps:
      - run:
          name: Ensure uv.lock is up to date
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv lock

  # Chromium (plus its deps) for the e2e jobs. The browser download is the
  # expensive half and changes only with uv.lock (the playwright pin), so it
  # is cached; `install` is a fast no-op when the cache is warm.
  install_playwright:
    steps:
      - restore_cache:
          keys:
            - v1-playwright-{{ checksum "uv.lock" }}
            - v1-playwright-
      - run:
          name: Install Playwright browsers
          command: uv run playwright install chromium --with-deps
      - save_cache:
          paths:
            - ~/.cache/ms-playwright
          key: v1-playwright-{{ checksum "uv.lock" }}

  # Report-on-every-push wrapper for a path-scoped job.
  #
  # CI is path-scoped (docs/topics/deployment/scoped-ci.md): a diff that
  # touches no scorecard files has nothing to test there. Filtering the
  # job out (`filters: "(pipeline.parameters.run-x == true)"`) is the
  # obvious way to skip it — but a job that never runs publishes *no*
  # status context, so the branch ruleset could not require it: a red
  # scorecard_js stayed invisible until the release PR (#2353 → #2356).
  #
  # So scoped jobs are always scheduled and decide *inside*: `needed:
  # false` skips the work in seconds and still reports a green context.
  # `full_gate` fans in all of them, which lets the ruleset require that
  # single context on branches: green means "every suite this diff
  # scoped in is green".
  #
  # A tag pipeline always resolves to a full run; a no-op there means the
  # scope mapping is broken, so it fails instead of turning a release
  # green without running it (same rule as `test_compose_network`).
  scoped_job:
    parameters:
      job_name:
        type: string
      needed:
        type: boolean
        default: true
      steps:
        type: steps
    steps:
      - when:
          condition: << parameters.needed >>
          steps:
            - steps: << parameters.steps >>
      - unless:
          condition: << parameters.needed >>
          steps:
            - run:
                name: << parameters.job_name >> is not in this diff's scope
                command: |
                  if [ -n "${CIRCLE_TAG:-}" ]; then
                    echo "<< parameters.job_name >> was scoped out of tag pipeline ${CIRCLE_TAG}." >&2
                    echo "A release must run the full matrix - scope-mapping.txt or this workflow is broken." >&2
                    exit 1
                  fi
                  echo "<< parameters.job_name >> is not affected by this diff - nothing to do."

  # Shared body for the fanned-out python shard jobs. Each shard checks
  # out the full repo (cross-app imports need the code) but runs only
  # its own pytest paths. Scopes are documented in
  # docs/topics/deployment/scoped-ci.md.
  python_shard_test:
    parameters:
      paths:
        type: string
      junit:
        type: string
      cov_flag:
        type: string
    steps:
      - run:
          name: run << parameters.paths >> tests
          environment:
            SECRET_KEY: 123456-TEST
            MYSQL_HOST: 127.0.0.1
            MYSQL_DB_NAME: test_test_db
            MYSQL_USER: root
            MYSQL_PWD: ""
          command: |
            uv run pytest << parameters.paths >> -n 4 --nomigrations --junitxml=test-reports/<< parameters.junit >> --cov=. --cov-report=xml --cov-report=html
      - store_test_results:
          path: test-reports
      - codecov/upload:
          flags: << parameters.cov_flag >>
          files: coverage.xml

  build_docker_image:
    parameters:
      dockerfile:
        type: string
      image_name:
        type: string
    steps:
      - run:
          name: Build Docker image << parameters.image_name >>
          command: |
            export DOCKER_BUILDKIT=1
            docker build \
              --cache-from=leaguesphere/<< parameters.image_name >>:latest \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -t << parameters.image_name >>:latest \
              -f << parameters.dockerfile >> .
            mkdir -p /tmp/docker-images
            docker save -o /tmp/docker-images/<< parameters.image_name >>.tar << parameters.image_name >>:latest
      - persist_to_workspace:
          root: /tmp
          paths:
            - docker-images/<< parameters.image_name >>.tar

  push_docker_image:
    parameters:
      image_name:
        type: string
      registry_image_name:
        type: string
      tag:
        type: string
      extra_tag:
        type: string
        default: ""
    steps:
      - attach_workspace:
          at: /tmp
      - run:
          name: Push Docker image << parameters.image_name >> to << parameters.registry_image_name >>
          command: |
            docker load -i /tmp/docker-images/<< parameters.image_name >>.tar
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin
            docker tag << parameters.image_name >>:latest << parameters.registry_image_name >>:<< parameters.tag >>
            docker push << parameters.registry_image_name >>:<< parameters.tag >>
            if [ -n "<< parameters.extra_tag >>" ]; then
              docker tag << parameters.image_name >>:latest << parameters.registry_image_name >>:<< parameters.extra_tag >>
              docker push << parameters.registry_image_name >>:<< parameters.extra_tag >>
            fi

jobs:
  # Fanned-out python shards (replaces the old monolith `python` job).
  # Each shard gets a fresh MySQL service and runs only its own paths;
  # the scope job in config.yml decides which shards run per change.
  # Shard → paths mapping is documented in
  # docs/topics/deployment/scoped-ci.md.
  python-core:
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      - image: cimg/python:3.15.2
      - image: cimg/mysql:26.10
        command: [ --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --default-storage-engine=InnoDB ]
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test_test_db
    working_directory: ~/repo
    steps:
      - scoped_job:
          job_name: python-core
          needed: << parameters.needed >>
          steps:
            - checkout
            - setup_uv
            - python_shard_test:
                paths: "league_manager/tests/ share/tests/ home/tests/ dbaccess/tests/"
                junit: "test-results-core.xml"
                cov_flag: "python-core"

  python-gamedays:
    parameters:
      needed:
        type: boolean
        default: true
    docker:
      - image: cimg/python:3.15.2
