# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

# CI is path-scoped (docs/topics/deployment/scoped-ci.md): a PR confined
# to one app runs only that app's shard(s) and skips the rest, so the
# skipped flags are not re-uploaded on that commit. Codecov would then
# drop the files exclusive to those flags from the project comparison and
# falsely fail codecov/project with a large apparent drop (issue #2015).
# Carry each flag forward from its last known coverage instead. Guarded
# by scripts/check_codecov_flags.py so a new shard can't drift.
flag_management:
  default_rules:
    carryforward: true

coverage:
  status:
    project:
      default:
        target: 80
        threshold: 1%
    patch:
      default:
        # 90% of the lines added/changed in a PR must be covered (1% grace
        # below). "auto" would effectively demand ~100% patch coverage,
        # which fails on small uncovered defensive branches.
        target: 90
        threshold: 1%

ignore:
  # Build tool configuration files (not application code)
  - "**/*.config.js"
  - "**/*.config.mjs"
  - "**/*.config.ts"
  - "**/*.config.mts"
  - "**/vite.config.*"
  - "**/vitest.config.*"
  - "**/webpack.config.*"
  - "**/jest.config.*"
  - "**/babel.config.*"

  # TypeScript config files
  - "**/tsconfig*.json"

  # Setup and test utility files
  - "**/setupTests.*"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__tests__/**"
  - "**/tests.py"
  - "**/test_*.py"
  - "**/*_test.py"

  # Schema files. The pytest shards run with --nomigrations (migrations are not
  # applied during tests), so these files are never imported and would sit at 0%
  # in the patch denominator - which makes any new app fail the 90% patch gate
  # for a reason that has nothing to do with its code.
  - "**/migrations/**"

  # Static and build output directories
  - "**/static/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
