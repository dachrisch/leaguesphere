[build-system]
# setuptools >= 77 is required for PEP 639 SPDX licence expressions
# (`license = "AGPL-3.0-or-later"` + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leaguesphere"
version = "6.0.0"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "Django==6.1.3",
    "django-crispy-forms==2.7",
    "crispy-bootstrap5==2026.9",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "django-pandas==0.6.7",
    "djangorestframework==3.18.3",
    "django-autocomplete-light==5.0.0",
    "django-formtools==2.7",
    "Markdown==3.11.4",
    "django-cors-headers==4.9.0",
    "Pillow==13.0.0",
    "django-rest-knox==6.0.0",
    "python-dotenv==1.2.4",
    "mysqlclient==2.3.2",
    "requests==2.34.2",
    "openpyxl==3.1.5",
    # Temporary DB access: Fernet for the one-time credential reveal.
    "cryptography==50.0.2",
]

[project.optional-dependencies]
test = [
    "django-webtest==1.9.15",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "django-debug-toolbar==8.0.0",
    "WebTest==3.0.7",
    "pytest-playwright>=0.7.2",
    "black==26.10.1",
    "types-factory_boy==0.4.1",
]
prod = [
    "gunicorn>=22.0.0",
    # ASGI worker for the liveticker-stream service (deployed/*.yaml).
    "uvicorn==0.54.0",
]

[tool.setuptools.package-data]
# The sport definitions are data: without this the wheel ships .py only and the
# loader fails at runtime while the source tree still looks fine.
gameevents = ["sport/*.json"]

[tool.setuptools.packages.find]
include = [
    "accounts*",
    "gameevents*",
    "gameday_designer*",
    "gamedays*",
    "journey*",
    "league_manager*",
    "league_table*",
    "liveticker*",
    "matchreport*",
    "officials*",
    "passcheck*",
    "scorecard*",
    "scorecard_v2*",
    "teammanager*"
]
