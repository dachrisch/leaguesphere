# Docker's embedded DNS on user-defined networks. A variable-based
# proxy_pass re-resolves the backend (valid=5s) instead of caching the
# container IP at startup — otherwise a watchtower recreate or blue-green
# cutover of the app container would leave www proxying to a dead IP.
resolver 127.0.0.11 valid=5s ipv6=off;

# Preserve the X-Forwarded-Proto from the upstream proxy (Traefik) that
# terminates TLS. The nginx<-Traefik hop is plaintext, so $scheme is "http";
# trusting it would make Django emit insecure http:// absolute URLs (e.g. DRF
# pagination `next`), which browsers block as mixed content on the HTTPS page.
map $http_x_forwarded_proto $forwarded_proto {
 default $http_x_forwarded_proto;
 ''      $scheme;
}

# The in-container healthcheck polls /login/ from localhost every 10s. Exempt
# it from the brute-force budget with an empty key (nginx skips limit_req when
# the key is empty); real clients always arrive via Traefik, never from
# localhost, so this cannot be used to bypass the limit.
map $remote_addr $login_limit_key {
 default $binary_remote_addr;
 127.0.0.1 "";
 ::1       "";
}

# Brute-force protection for the two HTML login forms. Burst 5 so a normal
# GET-the-page then POST-the-form round trip isn't throttled. The Knox token
# login (/api/accounts/auth/login/) is not covered -- django-axes with a
# shared cache is the follow-up for that.
limit_req_zone $login_limit_key zone=login:10m rate=5r/m;
limit_req_status 429;

server {
 listen 80;

 # At server level so /static/ inherits them too: nginx serves those requests
 # itself, and a location setting its own add_header would inherit none.
 add_header X-Powered-By "LeagueSphere and match-day coffee" always;
 add_header X-LeagueSphere-Status "kickoff" always;
 add_header X-LeagueSphere-Dynamic "live data: /llms-dynamic.txt" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

 # nginx only gzips text/html by default, and Django runs no GZipMiddleware.
 gzip on;
 gzip_vary on;
 gzip_comp_level 5;
 gzip_min_length 1024;
 gzip_proxied any;
 gzip_types application/json;

 # Inherited by the locations below, which set none of their own. Django
 # sends the two hidden headers as well; nginx owns them at the edge
 # (/static/ needs them), so each one is sent once.
 set $django_upstream "demo-app:8000";
 proxy_hide_header X-Content-Type-Options;
 proxy_hide_header Referrer-Policy;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $forwarded_proto;

 # Regex, not "location =", so /login without the trailing slash is limited
 # too instead of reaching Django's APPEND_SLASH redirect.
 location ~ ^/(admin/)?login/?$ {
  limit_req zone=login burst=5 nodelay;
  proxy_pass http://$django_upstream;
 }

 location / {
  proxy_pass http://$django_upstream;
 }

  location /static/ {
   alias /static/;
  }

  # User uploads (Team.logo): Django only serves MEDIA_URL with DEBUG=True,
  # so nginx owns /media/ in production. The `media` volume is mounted at
  # /media/ here (read-only) and at MEDIA_ROOT in the app container.
  # No add_header here so the server-level security headers are inherited.
  location /media/ {
   alias /media/;
   expires 7d;
  }
}
