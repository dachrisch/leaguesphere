# Docker's embedded DNS on user-defined networks. A variable-based
# proxy_pass re-resolves the backend (valid=5s) instead of caching the
# container IP at startup — otherwise a watchtower recreate or blue-green
# cutover of the app container would leave www proxying to a dead IP.
resolver 127.0.0.11 valid=5s ipv6=off;

# Preserve the X-Forwarded-Proto from the upstream proxy (Traefik) that
# terminates TLS. The nginx<-Traefik hop is plaintext, so $scheme is "http";
# trusting it would make Django emit insecure http:// absolute URLs (e.g. DRF
# pagination `next`), which browsers block as mixed content on the HTTPS page.
map $http_x_forwarded_proto $forwarded_proto {
 default $http_x_forwarded_proto;
 ''      $scheme;
}

server {
 listen 80;

 location / {
  set $django_upstream "demo-app:8000";
  add_header X-Powered-By "LeagueSphere and match-day coffee" always;
  add_header X-LeagueSphere-Status "kickoff" always;
  add_header X-LeagueSphere-Dynamic "live data: /llms-dynamic.txt" always;
  proxy_pass http://$django_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
 }

 location /static/ {
  alias /static/;
 }
}
