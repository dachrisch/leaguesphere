upstream django {
 server app:8000;
}

# Preserve the X-Forwarded-Proto from the upstream proxy (Traefik) that
# terminates TLS. The nginx<-Traefik hop is plaintext, so $scheme is "http";
# trusting it would make Django emit insecure http:// absolute URLs (e.g. DRF
# pagination `next`), which browsers block as mixed content on the HTTPS page.
map $http_x_forwarded_proto $forwarded_proto {
 default $http_x_forwarded_proto;
 ''      $scheme;
}

# Brute-force protection for the two password-login endpoints. Neither
# Django view is otherwise rate-limited (DRF's AnonRateThrottle only covers
# the API), so this is the login form's only defense against credential
# stuffing. 5r/m sustained with a burst of 5 (so a normal GET-the-page then
# POST-the-form round trip isn't itself throttled); requests beyond that get
# a plain 429 instead of reaching Django.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

server {
 listen 80;

 location = /login/ {
  limit_req zone=login burst=5 nodelay;
  proxy_pass http://django;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
 }

 location = /admin/login/ {
  limit_req zone=login burst=5 nodelay;
  proxy_pass http://django;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
 }

 location / {
  add_header X-Powered-By "LeagueSphere and match-day coffee" always;
  add_header X-LeagueSphere-Status "kickoff" always;
  add_header X-LeagueSphere-Dynamic "live data: /llms-dynamic.txt" always;
  proxy_pass http://django;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
 }

 location /static/ {
  alias /static/;
 }
}
