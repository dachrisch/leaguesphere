upstream django {
 server app:8000;
}

# Preserve the X-Forwarded-Proto from the upstream proxy (Traefik) that
# terminates TLS. The nginx<-Traefik hop is plaintext, so $scheme is "http";
# trusting it would make Django emit insecure http:// absolute URLs (e.g. DRF
# pagination `next`), which browsers block as mixed content on the HTTPS page.
map $http_x_forwarded_proto $forwarded_proto {
 default $http_x_forwarded_proto;
 ''      $scheme;
}

# Brute-force protection for the two HTML password-login forms (/login/ and
# /admin/login/). Neither Django view is otherwise rate-limited, so this is
# their only defense against credential stuffing. 5r/m sustained with a burst
# of 5 (so a normal GET-the-page then POST-the-form round trip isn't itself
# throttled); requests beyond that get a plain 429 instead of reaching Django.
#
# NOT covered: the Knox token login at /api/accounts/auth/login/ (only DRF's
# AnonRateThrottle applies there). django-axes with a cache shared across
# workers is the tracked follow-up for that.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

server {
 listen 80;

 # Response headers live at server level so every location inherits them --
 # including /static/, which nginx serves itself and Django never sees.
 # nginx only inherits add_header from the enclosing level when a location
 # defines none of its own, so keep add_header out of the location blocks.
 add_header X-Powered-By "LeagueSphere and match-day coffee" always;
 add_header X-LeagueSphere-Status "kickoff" always;
 add_header X-LeagueSphere-Dynamic "live data: /llms-dynamic.txt" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

 # gzip the JSON API. nginx only compresses text/html by default, and Django
 # runs no GZipMiddleware, so nothing double-compresses.
 gzip on;
 gzip_vary on;
 gzip_comp_level 5;
 gzip_min_length 1024;
 gzip_proxied any;
 gzip_types application/json;

 # Proxy settings shared by every proxied location below (inherited the same
 # way as add_header: only by locations that define none of their own).
 # Django emits X-Content-Type-Options and Referrer-Policy as well
 # (SECURE_CONTENT_TYPE_NOSNIFF, SECURE_REFERRER_POLICY); nginx owns them at
 # the edge because /static/ needs them too, so drop the upstream copies and
 # send each header once.
 proxy_hide_header X-Content-Type-Options;
 proxy_hide_header Referrer-Policy;
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $forwarded_proto;

 # Regex (not "location =") so the no-trailing-slash variants are limited
 # too: Django's APPEND_SLASH would otherwise answer GET /login with a 301
 # at full cost, bypassing the limiter.
 location ~ ^/(admin/)?login/?$ {
  limit_req zone=login burst=5 nodelay;
  proxy_pass http://django;
 }

 location / {
  proxy_pass http://django;
 }

 location /static/ {
  alias /static/;
 }
}
