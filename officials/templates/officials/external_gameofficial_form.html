{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="content-section">
    <form method="POST">
        {% csrf_token %}
        <fieldset class="form-group">
            <legend class="border-bottom mb-4">Neue EXTERNE Einsätze für Offizielle</legend>
            {{ form|crispy }}
        </fieldset>
        <div class="form-group">
            <button class="btn btn-outline-info" type="submit">Erstellen</button>
            <a class="btn btn-outline-secondary" href="{% url 'view-officials-gameofficial-import-upload' %}">
                Einsätze aus Datei importieren
            </a>
        </div>
    </form>
</div>
{% endblock content %}
