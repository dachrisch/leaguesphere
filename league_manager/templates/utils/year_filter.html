{% if url_pattern and season and years %}
<ul class="nav nav-pills">
    {% for year in years %}
    <li class="nav-item">
        <a class="nav-link {% if year == season %}active{% endif %}"
           href="{% if pk %}{% url url_pattern pk=pk season=year %}{% else %}{% url url_pattern season=year %}{% endif %}">{{ year }}</a>
    </li>
    {% endfor %}
</ul>
{% endif %}
