name: ${SERVICE_NAME}
services:
  www:
    image: leaguesphere/frontend:latest
    env_file: .env
    container_name: ${COMPOSE_PROJECT_NAME}.www
    # The frontend image ships a 10s healthcheck; override only the interval
    # (Docker keeps the image's test and merges per field). Every check is a
    # `docker exec` on a host that runs ~2.8/s of them, which contributes to
    # its queue-bound load; `retries` already gives a multi-minute detection
    # window. See servyy-container history/2026-10-30_load-alert-tuning.md.
    healthcheck:
      interval: 30s
    volumes:
      # User uploads: served directly by nginx at /media/ (see nginx.conf).
      # Read-only here; the app container owns the write side.
      - media:/media:ro
    labels:
      - traefik.enable=true
      # Required since 2026-10-29: servy's Traefik runs with
      # providers.docker.exposedByDefault=false, so a container is only
      # routed when its service opts in. Without this the site answers
      # Traefik's catchall 404 while the container looks healthy.
      # redirect service
      # https://jensknipper.de/blog/traefik-http-to-https-redirect/
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`leaguesphere.app`) || Host(`www.leaguesphere.app`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https
      - traefik.http.middlewares.${SERVICE_NAME}-https.redirectscheme.scheme=https

      # true service
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver

      # prod resolver
      - traefik.http.routers.${SERVICE_NAME}_prod.tls=true
      - traefik.http.routers.${SERVICE_NAME}_prod.rule=Host(`leaguesphere.app`) || Host(`www.leaguesphere.app`)
      - traefik.http.routers.${SERVICE_NAME}_prod.tls.certresolver=letsencrypthttpresolver

      # local service
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web
      # portainer team
      - io.portainer.accesscontrol.teams=leaguesphere
      - com.centurylinklabs.watchtower.scope=prod
      # Zero-downtime image swaps (openserbia watchtower fork): start green
      # alongside blue, gate on HEALTHCHECK, drain, retire blue. Stateless
      # nginx, no host ports, explicit Traefik routers -> blue-green eligible.
      - com.centurylinklabs.watchtower.update-strategy=blue-green
    networks:
      - backend
      - proxy
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: leaguesphere/backend:latest
    container_name: ${COMPOSE_PROJECT_NAME}.app
    # Production keeps a real worker pool (this is the real site) but 4, not 6:
    # a worker is ~310 MiB once warm (see the ceiling comment below), so 6 of
    # them need ~1.9 GiB and did not fit the 1g cap. 4 x 2 threads = 8
    # concurrent requests, against a measured peak of ~5 req/s (the daily
    # snapshot-bot burst) and a total container CPU draw of ~0.15 cores.
    #
    # --max-requests recycles a worker after ~500 requests: workers grow from
    # ~130 MiB cold to ~300 MiB over a day (844 MiB -> 1.8 GiB container total
    # in 26 h), so without recycling the container ends up pinned against its
    # cap, permanently reclaiming (cgroup memory.events max = 5559 on
    # 2026-10-30) and pushing ~940 MiB of live heap into swap.
    command: gunicorn -b 0.0.0.0:8000 -w 4 --worker-class gthread --threads 2 --max-requests 500 --max-requests-jitter 100 league_manager.wsgi
    # Ceiling, not a target. The 2026-10-29 measurement (454M resident + 334M
    # swapped, ~130 MiB/worker) was taken on freshly restarted workers; once
    # warm the 6-worker container sat at 854M RAM + 963M swap against a 1g
    # cap and spent the day in direct reclaim. 1.5g holds 4 warm workers
    # (~1.25 GiB) with headroom, and memswap_limit bounds the total at 2g so
    # the daemon's "2x memory" default cannot silently reserve 3g of this
    # 7.6 GiB host.
    mem_limit: 1500m
    memswap_limit: 2g
    labels:
      - traefik.enable=false
      # portainer team
      - io.portainer.accesscontrol.teams=leaguesphere
      - com.centurylinklabs.watchtower.scope=prod
      # Zero-downtime image swaps (openserbia watchtower fork): stateless
      # gunicorn against shared MySQL; requires migrations to stay
      # backwards-compatible while the old container drains.
      - com.centurylinklabs.watchtower.update-strategy=blue-green
    env_file: ls.env
    environment:
      DJANGO_SETTINGS_MODULE: league_manager.settings.prod
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}  # Default to false if not set
    networks:
      - backend   # For www communication
      - database  # For external MySQL access
    volumes:
      # MEDIA_ROOT is <BASE_DIR>/media = /app/league_manager/media.
      # A named volume survives Watchtower blue-green recreates, unlike the
      # container filesystem, so uploaded team logos persist across releases.
      - media:/app/league_manager/media
    restart: unless-stopped
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  db:
    image: mariadb:latest
    container_name: ${COMPOSE_PROJECT_NAME}.db
    restart: unless-stopped
    # Ceiling (was unlimited; 73M resident + 233M in swap measured 2026-10-29).
    # 512m covers the buffer pool plus connections without competing with the
    # apps for RAM under host pressure.
    mem_limit: 512m
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - "./mysql-data:/var/lib/mysql"
      - "./mysql-backup:/backup"
      - "./mysql-init:/docker-entrypoint-initdb.d:ro"
      # Directory mount (not a single file): `git pull` replaces files by
      # rename, which leaves a file bind-mount pointing at a dead inode.
      # Enables binlog (PITR) + the statement audit plugin; the restart
      # semantics are documented at the top of the mounted file.
      - "./mysql-conf:/etc/mysql/conf.d:ro"
    env_file: ls.env
    networks:
      - backend
      - database
    healthcheck:
      test: ["CMD", "sh", "-c", "mariadb -h localhost --skip-ssl -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s
    labels:
      - traefik.enable=false
      - io.portainer.accesscontrol.teams=leaguesphere
      - com.centurylinklabs.watchtower.scope=prod

  # Loopback-only TCP endpoint for the shared dbeaver_tunnel SSH account.
  # Deliberately a separate service: adding `ports:` to `db` recreates the prod
  # database container. Two network facts drive the wiring (both measured on a
  # scratch stack, see docs/plans/2026-10-25-prod-db-temp-credentials.md):
  #   * a port published from a container whose ONLY network is internal:true is
  #     silently dropped - no listener, no error - so the sidecar needs one
  #     non-internal network;
  #   * a multi-homed container dials its peer over that non-internal network, so
  #     joining `database` would make MySQL see 172.24.x and the 172.25.% grant
  #     would refuse the login. Hence `tunnel`, which db is NOT on.
  db-tunnel:
    image: alpine/socat:1.8.1.3
    container_name: ${COMPOSE_PROJECT_NAME}.db-tunnel
    restart: unless-stopped
    command: TCP-LISTEN:33063,fork,reuseaddr TCP:db:3306
    ports:
      - "127.0.0.1:33063:33063"
    networks:
      - backend
      - tunnel
    labels:
      - traefik.enable=false
      - io.portainer.accesscontrol.teams=leaguesphere

  # Mints and drops the temporary MySQL accounts. It is the only component in
  # the stack holding a credential that can CREATE USER, so it gets the smallest
  # possible surface: no published port, no volume, read-only rootfs, no new
  # privileges, its own env file, and deliberately NO watchtower label -
  # auto-swapping a container with this privilege is a supply-chain hole.
  # It talks to the app only through rows in the application schema.
  db-access:
    image: mariadb:latest
    container_name: ${COMPOSE_PROJECT_NAME}.db-access
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/dba/tick.sh"]
    command: ["--loop"]
    # Rendered by Ansible (ls_dbeaver_access) next to this file. Plain string,
    # not the `required: false` mapping: CI still runs compose v1, which cannot
    # parse that form. A stack that starts without it fails on the first tick -
    # tick.sh refuses to run with an incomplete environment.
    env_file: dba.env
    volumes:
      # The directory mount (not a single file) keeps a `git pull` from leaving
      # the container on a dead inode. It must stay world-readable: the
      # container drops ALL capabilities, so it has no DAC_OVERRIDE to bypass a
      # 0770 source directory and would fail with "Permission denied".
      - "./dba:/opt/dba:ro"
    networks:
      - backend          # 172.25.x only: the grant host depends on it
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false
      - io.portainer.accesscontrol.teams=leaguesphere

networks:
  backend:
    internal: true
  database:
    internal: false  # Allow external connectivity for MySQL
  # Publish-only bridge for db-tunnel: a port can only be published from a
  # non-internal network, and joining `database` would flip the DB connection's
  # source IP to 172.24.x. No other service joins it.
  tunnel:
    internal: false
  proxy:
    external: true

volumes:
  # Shared user uploads (Team.logo and friends). Named (not bind-mounted) so
  # blue-green container swaps keep the files.
  media:
