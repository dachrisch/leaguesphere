name: ${SERVICE_NAME}
services:
  mysql:
    image: mariadb:latest
    container_name: ${COMPOSE_PROJECT_NAME}.mysql
    restart: unless-stopped
    # Ceiling (was unlimited, 146M of it sat in swap on 2026-10-29). The dataset
    # is a restored copy of prod, so this is the same 512m as prod's db.
    mem_limit: 512m
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - "./mysql-data:/var/lib/mysql"
      - "./mysql-init:/docker-entrypoint-initdb.d:ro"
      # Same config as prod: binlog + statement audit. A directory mount, so a
      # `git pull` cannot leave the container reading a dead inode.
      - "./mysql-conf:/etc/mysql/conf.d:ro"
    env_file: ls.env.staging
    ports:
      - "127.0.0.1:33062:3306"
    networks:
      - backend
      - db_access
    healthcheck:
      test: ["CMD", "sh", "-c", "mariadb -h localhost --skip-ssl -u root -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s
    labels:
      - traefik.enable=false
      # portainer team
      - io.portainer.accesscontrol.teams=leaguesphere

  # Loopback-only TCP endpoint for the shared dbeaver_stage SSH account.
  # Mirrors prod's db-tunnel, and for the same measured reason: publishing the
  # mysql port directly (33062) delivers the *host's* address, so a forwarded
  # login arrives as 192.168.0.1 and the minted accounts' `172.26.%` grant
  # refuses it with 1045. This socat dials mysql over `backend` (172.26.x) and
  # publishes from `tunnel`, which is the only non-internal network it shares
  # with nothing else.
  db-tunnel:
    image: alpine/socat:1.8.1.3
    container_name: ${COMPOSE_PROJECT_NAME}.db-tunnel
    restart: unless-stopped
    command: TCP-LISTEN:33064,fork,reuseaddr TCP:mysql:3306
    ports:
      - "127.0.0.1:33064:33064"
    networks:
      - backend
      - tunnel
    labels:
      - traefik.enable=false
      - io.portainer.accesscontrol.teams=leaguesphere

  # Same executor as prod (see docker-compose.yaml): mints and drops the
  # temporary accounts for this stack. No socat of its own - db-tunnel above
  # is the one the SSH tunnel lands on.
  db-access:
    image: mariadb:latest
    container_name: ${COMPOSE_PROJECT_NAME}.db-access
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/dba/tick.sh"]
    command: ["--loop"]
    # Rendered by Ansible (ls_dbeaver_access) next to this file. Plain string,
    # not the `required: false` mapping: CI still runs compose v1, which cannot
    # parse that form. A stack that starts without it fails on the first tick -
    # tick.sh refuses to run with an incomplete environment.
    env_file: dba.env
    volumes:
      # Directory mount, world-readable (the container drops ALL capabilities):
      # see the note in docker-compose.yaml.
      - "./dba:/opt/dba:ro"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=false
      - io.portainer.accesscontrol.teams=leaguesphere

  www:
    image: leaguesphere/frontend:staging
    env_file: .env.staging
    container_name: ${COMPOSE_PROJECT_NAME}.www
    volumes:
      - "../container/nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro"
      - media:/media:ro
    labels:
      - traefik.enable=true
      # Required since 2026-10-29: servy's Traefik runs with
      # providers.docker.exposedByDefault=false, so a container is only
      # routed when its service opts in. Without this the site answers
      # Traefik's catchall 404 while the container looks healthy.
      # HTTP -> HTTPS redirect
      - traefik.http.routers.${SERVICE_NAME}-http.entrypoints=web
      - traefik.http.routers.${SERVICE_NAME}-http.rule=Host(`stage.leaguesphere.app`)
      - traefik.http.routers.${SERVICE_NAME}-http.middlewares=${SERVICE_NAME}-https
      - traefik.http.middlewares.${SERVICE_NAME}-https.redirectscheme.scheme=https

      # HTTPS for lehel.xyz (DNS resolver)
      - traefik.http.routers.${SERVICE_NAME}.tls=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencryptdnsresolver

      # HTTPS for leaguesphere.app (HTTP resolver)
      - traefik.http.routers.${SERVICE_NAME}_prod.tls=true
      - traefik.http.routers.${SERVICE_NAME}_prod.rule=Host(`stage.leaguesphere.app`)
      - traefik.http.routers.${SERVICE_NAME}_prod.tls.certresolver=letsencrypthttpresolver

      # Local resolution (HTTP)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.rule=Host(`${SERVICE_NAME}.${LOCAL_HOSTNAME}`)
      - traefik.http.routers.${SERVICE_NAME}_local_qualified.entrypoints=web

      # Portainer team
      - io.portainer.accesscontrol.teams=leaguesphere

      # Watchtower scope
      - com.centurylinklabs.watchtower.scope=dev
      # Zero-downtime image swaps (openserbia watchtower fork): start green
      # alongside blue, gate on HEALTHCHECK, drain, retire blue. Stateless
      # nginx, no host ports, explicit Traefik routers -> blue-green eligible.
      - com.centurylinklabs.watchtower.update-strategy=blue-green
    networks:
      - backend
      - proxy
    depends_on:
      staging-app:
        condition: service_healthy
    restart: unless-stopped

  staging-app:
    image: leaguesphere/backend:staging
    container_name: ${COMPOSE_PROJECT_NAME}.staging-app
    # 1 worker, not 6: production keeps `-w 6`, staging is a dev environment with
    # ~no traffic and each gunicorn worker costs ~134 MiB on the shared 4 vCPU /
    # 7.6 GiB host that also runs prod, demo, Moodle, three DB engines and the
    # monitor stack. 1 worker x 2 threads is ample for testing.
    command: gunicorn -b 0.0.0.0:8000 -w 1 --worker-class gthread --threads 2 league_manager.wsgi
    # Ceiling so a leak fails inside this container instead of pushing prod's
    # hot pages to swap (measured 2026-10-29: 645M resident, no limit).
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -A healthcheck -H \"Accept: application/json\" http://localhost:8000/health/?format=json"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    labels:
      - traefik.enable=false
      # portainer team
      - io.portainer.accesscontrol.teams=leaguesphere
      # Watchtower scope
      - com.centurylinklabs.watchtower.scope=dev
      # Zero-downtime image swaps (openserbia watchtower fork): stateless
      # gunicorn against shared MySQL; RUN_MIGRATIONS=true means the green
      # container migrates while blue drains — keep migrations
      # backwards-compatible (expand-then-contract).
      - com.centurylinklabs.watchtower.update-strategy=blue-green
    env_file: ls.env.staging
    environment:
      DJANGO_SETTINGS_MODULE: league_manager.settings.stage
      RUN_MIGRATIONS: true
    networks:
      - backend
      - egress
    volumes:
      - media:/app/league_manager/media
      - pass-photos:/app/league_manager/private/pass_photos
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    internal: true
  db_access:
    internal: false
  egress:
    internal: false
  # Publish-only bridge for db-tunnel: a port can only be published from a
  # non-internal network, and joining `db_access` would flip the connection's
  # source address away from 172.26.x. No other service joins this network.
  tunnel:
    internal: false
  proxy:
    external: true

volumes:
  media:
  pass-photos:
